<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>QR Code Styling</title>

  <style>
    body {
      text-align: center;
    }
    #container {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      width: 100%;
      gap: 20px;
    }
  </style>
</head>

<body>
  <h1>SVG QR Codes</h1>
  <div id="container"></div>
  <script type="text/javascript">
    const dotOptions = [
      "rounded", 
      "dots", 
      "classy", 
      "classy-rounded", "square", "extra-rounded", "gapped-square", "gapped-dots", "stars", "random-dots"
    ];


    const colors = ["#e8977d", "#d3e87d", "#7de88e", "#7ddbe8", "#867de8", "#e87de4", "#ee5253", "#576574", "#ff9f43", ""];
    const cornerDot = ['rounded', 'circle', 'classy', 'classy-rounded', 'square', 'extra-rounded', 'square', 'circle', "star", "rounded"];
    const cornerSquare = ['rounded', 'circle', 'classy', 'classy-rounded', 'square', 'extra-rounded', 'square-thin' , 'dots-light', 'rounded', "rounded"];

    let options = {
      width: 300,
      height: 300,
      data: "https://pqr.ac/waidhi",
      imageOptions: {
        crossOrigin: "anonymous",
        margin: 10,
        // hideBackgroundDots: false
      },
      type: 'svg',
    };


    dotOptions.forEach((dotOption, i) => {
      options["dotsOptions"] = { 
        ...options["dotsOptions"],
        roundSize: false,
        type: dotOptions[i],
        color: colors[i],
        gradient: colors[i] == '' ? {
          type: "linear",
          colorStops: [{ offset: 0, color: 'blue' }, { offset: 1, color: 'red' }]
        } : null
      };
      options["cornersSquareOptions"] = {
        ...options["cornersSquareOptions"],
        type: cornerSquare[i],
        color: colors[i],
        gradient: colors[i] == '' ? {
          type: "linear",
          colorStops: [{ offset: 0, color: 'blue' }, { offset: 1, color: 'red' }]
        } : null
      };
      options["cornersDotOptions"] = {
        ...options["cornersDotOptions"],
        type: cornerDot[i],
        color: colors[i],
        gradient: colors[i] == '' ? {
          type: "linear",
          colorStops: [{ offset: 0, color: 'blue' }, { offset: 1, color: 'red' }]
        } : null
      };
      options = {
        ...options,
        image: i % 2 == 0 ? "/pc_icon.svg" : "/pc_logo.png",
      }

      const qrCode = new QRCodeStyling(options);
      async function test(){
        const svgString = await qrCode.toOptimizedSVGString();
        const span = document.createElement("span")
        span.innerHTML = svgString + `<div><br/>
          Dots: ${dotOptions[i]}<br/>
          Corner Square: ${cornerSquare[i]}<br/>
          Corner Dot: ${cornerDot[i]}<br/>
        </div>`;

        document.getElementById("container").appendChild(span);
      }
      test();
    });
  </script>
</body>
</html>
