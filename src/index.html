<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>QR Code Styling</title>

  <style>
    body {
      text-align: center;
    }
    #container {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      width: 100%;
      gap: 20px;
    }
  </style>
</head>

<body>
  <h1>SVG QR Codes</h1>
  <div id="container"></div>
  <script type="text/javascript">
    const dotOptions = [
      "square",
      "rounded",
      "dots", 
      "classy", 
      "classy-rounded", "square", "extra-rounded", "gapped-square", "gapped-dots", "stars", "random-dots"
    ];


    const colors = ["", "#e8977d", "#d3e87d", "#7de88e", "#7ddbe8", "#867de8", "#e87de4", "#ee5253", "#576574", "#ff9f43", ""];
    const cornerDot = ['square','rounded', 'circle', 'classy', 'classy-rounded', 'square', 'extra-rounded', 'square', 'circle', "star", "rounded"];
    const cornerSquare = [
      'square',
      'rounded',
      'circle', 
      'classy', 
      'classy-rounded', 
      'rounded', 
      'extra-rounded', 'square-thin' , 'dots-light', 'rounded', "rounded"];

    let options = {
      width: 300,
      height: 300,
      data: "https://pqr.ac/waidhi",
      imageOptions: {
        crossOrigin: "anonymous",
        margin: 10,
        // hideBackgroundDots: false
      },
      type: 'svg',
      
    };


    dotOptions.forEach((dotOption, i) => {
      options["dotsOptions"] = { 
        ...options["dotsOptions"],
        roundSize: false,
        type: dotOptions[i],
        color: colors[i],
        gradient: colors[i] == '' ? {
          type: "linear",
          colorStops: [{ offset: 0, color: 'blue' }, { offset: 1, color: 'red' }]
        } : null
      };
      options["cornersSquareOptions"] = {
        ...options["cornersSquareOptions"],
        type: cornerSquare[i],
        color: colors[i],
        gradient: colors[i] == '' ? {
          type: "linear",
          colorStops: [{ offset: 0, color: 'blue' }, { offset: 1, color: 'red' }]
        } : null
      };
      options["cornersDotOptions"] = {
        ...options["cornersDotOptions"],
        type: cornerDot[i],
        color: colors[i],
        gradient: colors[i] == '' ? {
          type: "linear",
          colorStops: [{ offset: 0, color: 'blue' }, { offset: 1, color: 'red' }]
        } : null
      };
      options = {
        ...options,
        svgIcon: `<svg xmlns="http://www.w3.org/2000/svg" width="50" height="49" viewBox="0 0 50 49" fill="none"><path d="M4.60204 31.6326L4.08163 42.102V42.0714L0 46.1939L5.08163 48.7347L7.89796 45.9184V45.8775L18.3674 45.398L19.7959 43.7347L6.26531 30.2041L4.60204 31.6326Z M49.0817 5.39794L44.6021 0.918343C43.449 -0.234719 41.5817 -0.316352 40.3572 0.755077L7.81633 28.8571L21.1531 42.1939L49.2449 9.69386C50.3164 8.41835 50.2347 6.551 49.0817 5.39794Z" fill="black"/></svg>`,
        image: i % 2 == 0 ? "" : "/pc_logo.png",
        // backgroundOptions: {
        //   // color: "transparent"
        // }
      }

      const qrCode = new QRCodeStyling(options);
      async function test(){
        const svgString = await qrCode.toSVGString();
        const span = document.createElement("span")


        span.innerHTML = svgString + `<div>
          # ${i + 1}<br/>
          Dots: ${dotOptions[i]}<br/>
          Corner Square: ${cornerSquare[i]}<br/>
          Corner Dot: ${cornerDot[i]}<br/>
          <button id="db_btn_${dotOptions[i]}">Download SVG</button>
        </div>`;

        // qrCode.append(document.getElementById("container"));

        document.getElementById("container").appendChild(span);

        document.getElementById(`db_btn_${dotOptions[i]}`).onclick = function () { 
          qrCode.download({
            name: dotOptions[i],
            extension: 'svg'
          });
        };
      }
      test();
    });
  </script>
</body>
</html>
